name: jobportal-dev

networks:
  jobportal-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  prometheus-dev-data:
  grafana-dev-data:
  loki-dev-data:

x-service-env: &service-env
  NODE_ENV: development
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-64-char-hex-string}
  DB_HOST: postgres-dev
  DB_PORT: 5432
  DB_USER: ${DB_USER:-jobportal}
  DB_PASSWORD: ${DB_PASSWORD:-jobportal_dev_password_change_me}
  USER_SERVICE_DB: ${USER_SERVICE_DB:-user_db}
  JOB_SERVICE_DB: ${JOB_SERVICE_DB:-job_db}
  APPLICATION_SERVICE_DB: ${APPLICATION_SERVICE_DB:-application_db}
  NOTIFICATION_SERVICE_DB: ${NOTIFICATION_SERVICE_DB:-notification_db}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-jobportal}:${RABBITMQ_PASS:-jobportal_dev_password_change_me}@rabbitmq-dev:5672

services:
  app:
    build:
      context: ./app
    image: jobportal/app:dev
    container_name: app-dev
    ports:
      - "3105:80"
    environment:
      GATEWAY_URL: http://localhost:3100/api/v1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      args:
        ENVIRONMENT: dev
    image: jobportal/gateway:dev
    container_name: gateway-dev
    ports:
      - "3100:80"
    depends_on:
      app:
        condition: service_healthy
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
    image: jobportal/user-service:dev
    container_name: user-service-dev
    ports:
      - "3101:3000"
    environment:
      <<: *service-env
      PORT: 3000
      DB_NAME: ${USER_SERVICE_DB:-user_db}
    volumes:
      - ./services/user-service/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  job-service:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile.dev
    image: jobportal/job-service:dev
    container_name: job-service-dev
    ports:
      - "3102:3001"
    environment:
      <<: *service-env
      PORT: 3001
      DB_NAME: ${JOB_SERVICE_DB:-job_db}
    volumes:
      - ./services/job-service/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile.dev
    image: jobportal/application-service:dev
    container_name: application-service-dev
    ports:
      - "3103:3002"
    environment:
      <<: *service-env
      PORT: 3002
      DB_NAME: ${APPLICATION_SERVICE_DB:-application_db}
    volumes:
      - ./services/application-service/src:/app/src:ro
      - ./services/application-service/rabbitmq:/app/rabbitmq:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
    image: jobportal/notification-service:dev
    container_name: notification-service-dev
    ports:
      - "3104:3003"
    environment:
      <<: *service-env
      PORT: 3003
      DB_NAME: ${NOTIFICATION_SERVICE_DB:-notification_db}
    volumes:
      - ./services/notification-service/src:/app/src:ro
      - ./services/notification-service/rabbitmq:/app/rabbitmq:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    ports:
      - "3110:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobportal_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./infrastructure/databases/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-dev
    ports:
      - "3111:5672"
      - "3112:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jobportal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-jobportal_dev_password_change_me}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus-dev
    ports:
      - "3120:9090"
    volumes:
      - prometheus-dev-data:/prometheus
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana-dev
    ports:
      - "3121:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin_dev_password_change_me}
    volumes:
      - grafana-dev-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.5
    container_name: loki-dev
    ports:
      - "3122:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki-dev-data:/tmp/loki
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-dev-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.5
    container_name: promtail-dev
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infrastructure/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - jobportal-dev-network
    restart: unless-stopped
