apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: jobportal-prod
  labels:
    app: jobportal
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: jobportal-prod
        replica: '{{.ExternalURL}}'

    alerting:
      alertmanagers: []

    rule_files: []

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service:3000']
        metrics_path: /metrics
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'job-service'
        static_configs:
          - targets: ['job-service:3001']
        metrics_path: /metrics
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'application-service'
        static_configs:
          - targets: ['application-service:3002']
        metrics_path: /metrics
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'notification-service'
        static_configs:
          - targets: ['notification-service:3003']
        metrics_path: /metrics
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'gateway'
        static_configs:
          - targets: ['gateway:80']
        metrics_path: /metrics
        scrape_interval: 15s
        scrape_timeout: 10s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: jobportal-prod
  labels:
    app: jobportal
    component: monitoring
    monitor: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: monitoring
        monitor: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: http
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--web.enable-lifecycle'
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir: {}
