apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: jobportal-prod
  labels:
    app: jobportal
    component: gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        component: gateway
    spec:
      initContainers:
        - name: wait-for-user-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for User Service to be ready..."
              until nc -z user-service 3000; do
                echo "User Service is not ready yet. Retrying in 2s..."
                sleep 2
              done
              echo "User Service is ready!"
        - name: wait-for-job-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Job Service to be ready..."
              until nc -z job-service 3001; do
                echo "Job Service is not ready yet. Retrying in 2s..."
                sleep 2
              done
              echo "Job Service is ready!"
        - name: wait-for-application-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Application Service to be ready..."
              until nc -z application-service 3002; do
                echo "Application Service is not ready yet. Retrying in 2s..."
                sleep 2
              done
              echo "Application Service is ready!"
        - name: wait-for-notification-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Notification Service to be ready..."
              until nc -z notification-service 3003; do
                echo "Notification Service is not ready yet. Retrying in 2s..."
                sleep 2
              done
              echo "Notification Service is ready!"
      containers:
        - name: gateway
          image: jobportal/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: jobportal-config
          env:
            - name: NGINX_WORKER_PROCESSES
              value: "auto"
            - name: NGINX_WORKER_CONNECTIONS
              value: "1024"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
