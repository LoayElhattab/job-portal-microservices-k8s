apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
  namespace: jobportal-prod
  labels:
    app: jobportal
    component: job-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
        component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgres 5432; do
                echo "PostgreSQL is not ready yet. Retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: job-service
          image: jobportal/job-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: jobportal-config
            - secretRef:
                name: jobportal-secrets
          env:
            - name: SERVICE_NAME
              value: "job-service"
            - name: SERVICE_PORT
              value: "3001"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: jobportal-config
                  key: JOB_SERVICE_DB
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
