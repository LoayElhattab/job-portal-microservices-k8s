name: jobportal-prod

networks:
  jobportal-prod-network:
    driver: bridge

volumes:
  postgres-prod-data:

services:
  gateway:
    image: nginx:1.25-alpine
    container_name: gateway-prod
    ports:
      - "3300:80"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:80/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - jobportal-prod-network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile # Changed from Dockerfile.prod
    container_name: user-service-prod
    ports:
      - "3301:3000"
    env_file:
      - .env.prod
    environment:
      - PORT=3000
      - DB_NAME=${USER_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-prod-network
    restart: unless-stopped

  job-service:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile # Changed from Dockerfile.prod
    container_name: job-service-prod
    ports:
      - "3302:3001"
    env_file:
      - .env.prod
    environment:
      - PORT=3001
      - DB_NAME=${JOB_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3001/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-prod-network
    restart: unless-stopped

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile # Changed from Dockerfile.prod
    container_name: application-service-prod
    ports:
      - "3303:3002"
    env_file:
      - .env.prod
    environment:
      - PORT=3002
      - DB_NAME=${APPLICATION_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3002/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-prod-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile # Changed from Dockerfile.prod
    container_name: notification-service-prod
    ports:
      - "3304:3003"
    env_file:
      - .env.prod
    environment:
      - PORT=3003
      - DB_NAME=${NOTIFICATION_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3003/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-prod-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    ports:
      - "3310:5432"
    env_file:
      - .env.prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./infrastructure/databases/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro # Fixed path
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - jobportal-prod-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-prod
    ports:
      - "3311:5672"
      - "3312:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?err}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?err}
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-prod-network
    restart: unless-stopped
