name: jobportal-test

networks:
  jobportal-test-network:
    driver: bridge

volumes:
  postgres-test-data:
  grafana-test-data:
  prometheus-test-data:

services:
  gateway:
    image: nginx:1.25-alpine
    container_name: gateway-test
    ports:
      - "3100:80"
    volumes:
      - ./gateway/nginx.test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:80/health > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.test
    container_name: user-service-test
    ports:
      - "3101:3000"
    env_file:
      - .env.test
    environment:
      - PORT=3000
      - DB_NAME=${USER_SERVICE_DB:?err}
    volumes:
      - ./services/user-service/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  job-service:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile.test
    container_name: job-service-test
    ports:
      - "3102:3001"
    env_file:
      - .env.test
    environment:
      - PORT=3001
      - DB_NAME=${JOB_SERVICE_DB:?err}
    volumes:
      - ./services/job-service/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3001/health > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile.test
    container_name: application-service-test
    ports:
      - "3103:3002"
    env_file:
      - .env.test
    environment:
      - PORT=3002
      - DB_NAME=${APPLICATION_SERVICE_DB:?err}
    volumes:
      - ./services/application-service/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3002/health > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.test
    container_name: notification-service-test
    ports:
      - "3104:3003"
    env_file:
      - .env.test
    environment:
      - PORT=3003
      - DB_NAME=${NOTIFICATION_SERVICE_DB:?err}
    volumes:
      - ./services/notification-service/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3003/health > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres-test
    ports:
      - "3110:5432"
    env_file:
      - .env.test
    environment:
      # Fallback default DB for health check if POSTGRES_DB not in .env.test
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-test
    ports:
      - "3111:5672"
      - "3112:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?err}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?err}
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus-test
    ports:
      - "3120:9090"
    volumes:
      - prometheus-test-data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana-test
    ports:
      - "3121:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-test-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /test/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobportal-test-network
    restart: unless-stopped
