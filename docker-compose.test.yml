name: jobportal-test

networks:
  jobportal-test-network:
    driver: bridge

volumes:
  postgres-test-data:
  grafana-test-data:
  prometheus-test-data:

services:
  gateway:
    image: nginx:1.25-alpine
    container_name: gateway-test
    ports:
      - "3200:80" # Changed to 3200 to match Section 5 of README
    volumes:
      - ./gateway/nginx.test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile # Changed from Dockerfile.test
    container_name: user-service-test
    ports:
      - "3201:3000"
    env_file:
      - .env.test
    environment:
      - PORT=3000
      - DB_NAME=${USER_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  job-service:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile # Changed from Dockerfile.test
    container_name: job-service-test
    ports:
      - "3202:3001"
    env_file:
      - .env.test
    environment:
      - PORT=3001
      - DB_NAME=${JOB_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile # Changed from Dockerfile.test
    container_name: application-service-test
    ports:
      - "3203:3002"
    env_file:
      - .env.test
    environment:
      - PORT=3002
      - DB_NAME=${APPLICATION_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile # Changed from Dockerfile.test
    container_name: notification-service-test
    ports:
      - "3204:3003"
    env_file:
      - .env.test
    environment:
      - PORT=3003
      - DB_NAME=${NOTIFICATION_SERVICE_DB:?err}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres-test
    ports:
      - "3210:5432"
    env_file:
      - .env.test
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./infrastructure/databases/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro # Fixed path
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobportal-test-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-test
    ports:
      - "3211:5672"
      - "3212:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?err}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?err}
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "5672" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobportal-test-network
