name: Gateway CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'gateway/**'

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: gateway/Dockerfile
