name: Flutter CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'app/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: app/
        run: flutter pub get

      - name: Run tests
        working-directory: app/
        run: flutter test
