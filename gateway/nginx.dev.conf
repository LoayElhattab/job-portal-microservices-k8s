upstream user_service    { server user-service-dev:3000; }
upstream job_service     { server job-service-dev:3001; }
upstream app_service     { server app-service-dev:3002; }
upstream notif_service   { server notif-service-dev:3003; }

# gzip compression for faster response
gzip on;
gzip_types application/json;
gzip_min_length 1000;

server {
    listen 80;
    server_tokens off; # disable server version display
    client_max_body_size 2M; # increase body size to 2MB
    add_header 'Access-Control-Allow-Origin' '*' always; 
    add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    if ($request_method = 'OPTIONS') { return 204; } 

    location /api/v1/users/         { proxy_pass http://user_service/api/v1/users/; }
    location /api/v1/jobs/          { proxy_pass http://job_service/api/v1/jobs/; }
    location /api/v1/applications/  { proxy_pass http://app_service/api/v1/applications/; }
    location /api/v1/notifications/ { proxy_pass http://notif_service/api/v1/notifications/; }

    location /health {
        return 200 '{"success":true,"data":{"gateway":"ok"}}';
        add_header Content-Type application/json;
    }

    error_page 404 @404_json;
    location @404_json {
        add_header Content-Type application/json;
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Route not found"}}';
    }

    error_page 502 503 504 @backend_error;
    location @backend_error {
        add_header Content-Type application/json;
        return 502 '{"success":false,"error":{"code":"GATEWAY_ERROR","message":"Backend service unavailable"}}';
    }
}